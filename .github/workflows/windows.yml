name: Build Windows installer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows app
        run: dotnet publish windows/DimaAI.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -o windows/publish/win-x64

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows\installer.iss"'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DimaAI-Windows-10-x64-Installer
          path: windows/publish/installer/DimaAI-Setup-0.0.3-Windows-x64.exe
          if-no-files-found: error